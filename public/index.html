<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radio360</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
        integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
        crossorigin="anonymous" defer>
    </script>

    <style>
      body {
        font-family: sans-serif;
      }

      #player {
        position: absolute;
        height: 30%;
        width: 300px;
        background-color: white;
        z-index: 1000;
        margin-left: 20px;
        opacity: 0.5;
        bottom: 25px;
        border-radius: 8px;
      }

      #station-name {
        font-size: 3.6vh;
        height: 15%;
      }

      #station-location {
        font-size: 1.8vh;
        height: 7.5%;
      }

      .station-info {
        width: 100%;
        padding-left: 5px;
      }
    </style>

  </head>
  <body style="margin: 0; overflow: hidden">
    <div id="player">
      <div id="station-name" class="station-info">Example station</div>
      <div id="station-location" class="station-info">London, United Kingdom</div>
      <div id="station-stream" class="station-info">https://example.com</div>
    </div>
    <div id="root"></div>
    
  </body>
</html>
